<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>iOS WebXR AR – ランダムボックス</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;}
  #enterBtn{
    position:absolute;top:20px;left:50%;transform:translateX(-50%);
    padding:12px 24px;font-size:16px;background:#0066ff;color:#fff;
    border:none;border-radius:8px;z-index:10;cursor:pointer;
  }
</style>
</head>
<body>
<button id="enterBtn">Start AR</button>

<!-- three.js (r158) -->
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';
import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/webxr/ARButton.js';

(() => {
  const btn = document.getElementById('enterBtn');

  // -------------------------------------------------
  // 1️⃣ 環境チェック
  // -------------------------------------------------
  async function canStartAR() {
    if (!navigator.xr) return false;
    return await navigator.xr.isSessionSupported('immersive-ar');
  }

  btn.addEventListener('click', async () => {
    if (!(await canStartAR())) {
      alert('この端末・ブラウザでは AR が使えません。Safari の「設定 → 詳細 → WebXR」をオンにしてください。');
      return;
    }

    // -------------------------------------------------
    // 2️⃣ three.js 基本セットアップ
    // -------------------------------------------------
    const scene   = new THREE.Scene();
    const camera  = new THREE.PerspectiveCamera();
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    btn.style.display = 'none';

    // 簡易照明
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    scene.add(light);

    // -------------------------------------------------
    // 3️⃣ XR セッション開始
    // -------------------------------------------------
    const sessionInit = {
      requiredFeatures: ['hit-test', 'dom-overlay'],
      domOverlay: { root: document.body }
      // ← plane‑detection は iOS では未実装なので外す
    };

    const xrSession = await navigator.xr.requestSession('immersive-ar', sessionInit);
    renderer.xr.setSession(xrSession);

    // 参照空間
    const refSpace   = await xrSession.requestReferenceSpace('local');
    const viewerSpace = await xrSession.requestReferenceSpace('viewer');
    const hitTestSrc = await xrSession.requestHitTestSource({ space: viewerSpace });

    // -------------------------------------------------
    // 4️⃣ ランダム箱ユーティリティ
    // -------------------------------------------------
    const boxMat = new THREE.MeshStandardMaterial({ color:0x00ff00, roughness:0.5 });
    function createBoxAt(pos) {
      const size = 0.1 + Math.random()*0.2; // 10‑30 cm
      const geom = new THREE.BoxGeometry(size, size, size);
      const mesh = new THREE.Mesh(geom, boxMat);
      mesh.position.set(
        pos.x + (Math.random()-0.5)*0.4,
        pos.y + size/2,
        pos.z + (Math.random()-0.5)*0.4
      );
      scene.add(mesh);
    }

    // -------------------------------------------------
    // 5️⃣ アニメーションループ
    // -------------------------------------------------
    let placed = false;
    renderer.setAnimationLoop((time, frame) => {
      if (frame) {
        const hits = frame.getHitTestResults(hitTestSrc);
        if (hits.length > 0 && !placed) {
          const hitPose = hits[0].getPose(refSpace);
          const p = hitPose.transform.position;
          for (let i = 0; i < 5; i++) createBoxAt(p);
          placed = true;
        }
      }
      renderer.render(scene, camera);
    });

    // -------------------------------------------------
    // 6️⃣ セッション終了ハンドラ（任意）
    // -------------------------------------------------
    xrSession.addEventListener('end', () => {
      renderer.setAnimationLoop(null);
      renderer.domElement.remove();
      btn.style.display = 'block';
    });
  });
})();
</script>
</body>
</html>
