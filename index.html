
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human Recognition System</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#111;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:16px;
 border-bottom:1px solid #333;
}
h2{margin:0;font-size:19px}
main{padding:16px;max-width:900px;margin:auto}
#screen{
 position:relative;
 width:100%;
 background:#000;
 overflow:hidden;
 border-radius:10px;
}
video{
 display:block;
 width:100%;
}
canvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 pointer-events:none;
}
.panel{
 margin-top:15px;
 padding:15px;
 background:#202020;
 border-radius:10px;
}
input,button{
 width:100%;
 padding:12px;
 margin-top:8px;
 border:0;
 border-radius:6px;
 font-size:15px;
}
button{
 background:#2878df;
 color:white;
 cursor:pointer;
}
button:disabled{opacity:.4}
#status{color:#aaa;font-size:13px;margin-top:12px}
#people{margin-top:10px;color:#ccc;font-size:14px}
.blue{color:#3989ff}
.red{color:#ff4545}
small{color:#999}
</style>
</head>
<body>

<header>
<h2>Human Recognition System</h2>
</header>

<main>

<div id="screen">
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
</div>

<div class="panel">
<h3>人物登録</h3>

<input id="personName" placeholder="登録する人の名前">

<label style="font-size:13px">
<input id="consent" type="checkbox" style="width:auto">
本人の同意を得て登録します
</label>

<button id="register" disabled>人物を登録（8秒間）</button>

<div id="status">AIモデルを読み込んでください。</div>
</div>

<div class="panel">
<h3>登録済み人物</h3>
<div id="people">登録なし</div>
<button id="clear">登録データを全削除</button>
</div>

</main>

<!-- AIライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const status=document.getElementById("status");
const people=document.getElementById("people");
const registerButton=document.getElementById("register");

let bodyModel=null;
let ready=false;
let running=false;
let registration=null;

let registered=JSON.parse(
 localStorage.getItem("registeredPeople")||"[]"
);

// 顔認識の許容距離
const MATCH_THRESHOLD=0.48;

// 登録情報の表示
function updatePeople(){
 if(registered.length===0){
  people.textContent="登録なし";
  return;
 }

 people.innerHTML="";

 registered.forEach((person,index)=>{
  const div=document.createElement("div");
  div.style.padding="8px 0";

  const name=document.createElement("span");
  name.textContent=person.name;

  const remove=document.createElement("button");
  remove.textContent="削除";
  remove.style.width="70px";
  remove.style.marginLeft="10px";
  remove.onclick=()=>{
   registered.splice(index,1);
   save();
   updatePeople();
  };

  div.append(name,remove);
  people.appendChild(div);
 });
}

// 保存
function save(){
 localStorage.setItem(
  "registeredPeople",
  JSON.stringify(registered)
 );
}

// AIモデル読み込み
async function loadModels(){
 status.textContent="AIモデル読み込み中...";

 try{
  await faceapi.nets.tinyFaceDetector.loadFromUri(
   "https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights"
  );

  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(
   "https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights"
  );

  await faceapi.nets.faceRecognitionNet.loadFromUri(
   "https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights"
  );

  bodyModel=await cocoSsd.load({
   base:"lite_mobilenet_v2"
  });

  status.textContent="AIモデル読み込み完了";
  registerButton.disabled=false;

 }catch(error){
  status.textContent="モデル読み込みエラー: "+error.message;
  console.error(error);
 }
}

// カメラ開始
async function startCamera(){
 try{
  const stream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:"user",
    width:{ideal:640},
    height:{ideal:480}
   },
   audio:false
  });

  video.srcObject=stream;

  await new Promise(resolve=>{
   video.onloadedmetadata=resolve;
  });

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  ready=true;
  detectLoop();

 }catch(error){
  status.textContent="カメラエラー: "+error.message;
 }
}

// 顔認識
function recognizeFace(descriptor){
 let best=null;
 let bestDistance=Infinity;

 for(const person of registered){
  for(const saved of person.descriptors){
   const distance=faceapi.euclideanDistance(
    descriptor,
    saved
   );

   if(distance<bestDistance){
    bestDistance=distance;
    best=person;
   }
  }
 }

 if(best && bestDistance<MATCH_THRESHOLD){
  return best.name;
 }

 return null;
}

// 描画
function drawPerson(person,name){
 const [x,y,w,h]=person.bbox;

 ctx.strokeStyle=name?"#ff3030":"#3989ff";
 ctx.lineWidth=3;

 ctx.strokeRect(x,y,w,h);

 const label=name||"Unknown";

 ctx.font="bold 17px Arial";

 const textWidth=ctx.measureText(label).width;

 ctx.fillStyle=name?"#ff3030":"#3989ff";

 ctx.fillRect(
  x,
  Math.max(0,y-25),
  textWidth+14,
  25
 );

 ctx.fillStyle="white";

 ctx.fillText(label,x+7,Math.max(18,y-7));
}

// メイン処理
async function detectLoop(){
 if(!ready || !running && registration===null)return;

 try{
  const [persons,faces]=await Promise.all([

   bodyModel.detect(video,20,0.45),

   faceapi
    .detectAllFaces(
     video,
     new faceapi.TinyFaceDetectorOptions({
      inputSize:320,
      scoreThreshold:0.5
     })
    )
    .withFaceLandmarks(true)
    .withFaceDescriptors()

  ]);

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 登録中は最大の顔の特徴を記録
  if(registration){
   if(Date.now()>=registration.end){
    finishRegistration();
   }else if(faces.length>0){
    let largest=faces[0];

    for(const face of faces){
     if(
      face.detection.box.width>
      largest.detection.box.width
     ){
      largest=face;
     }
    }

    registration.descriptors.push(
     Array.from(largest.descriptor)
    );

    status.textContent=
     "登録中... 特徴データ "+ 
     registration.descriptors.length+" 件";
   }
  }

  let recognizedCount=0;

  // 人物ごとに顔を照合
  for(const person of persons){
   if(person.class!=="person")continue;

   const [x,y,w,h]=person.bbox;

   let matchedFace=null;

   for(const face of faces){
    const box=face.detection.box;

    const centerX=box.x+box.width/2;
    const centerY=box.y+box.height/2;

    // 顔が人物の枠内にあるか
    if(
     centerX>=x &&
     centerX<=x+w &&
     centerY>=y &&
     centerY<=y+h
    ){
     matchedFace=face;
     break;
    }
   }

   let name=null;

   if(matchedFace){
    name=recognizeFace(
     matchedFace.descriptor
    );
   }

   if(name)recognizedCount++;

   drawPerson(person,name);
  }

  status.textContent=registration
   ?"人物登録中..."
   :"検出人数: "+persons.filter(p=>p.class==="person").length+
    " / 登録人物一致: "+recognizedCount;

 }catch(error){
  console.error(error);
 }

 setTimeout(detectLoop,400);
}

// 登録開始
registerButton.onclick=()=>{
 const name=document.getElementById("personName").value.trim();
 const consent=document.getElementById("consent").checked;

 if(!name){
  alert("名前を入力してください");
  return;
 }

 if(!consent){
  alert("本人の同意を確認してください");
  return;
 }

 if(registration){
  alert("すでに登録中です");
  return;
 }

 registration={
  name:name,
  descriptors:[],
  end:Date.now()+8000
 };

 status.textContent=
  "カメラの前でゆっくり一回転してください。";

};

// 登録完了
function finishRegistration(){
 if(!registration)return;

 const data=registration;
 registration=null;

 if(data.descriptors.length<3){
  status.textContent=
   "顔を十分に検出できませんでした。再登録してください。";
  return;
 }

 registered.push({
  name:data.name,
  descriptors:data.descriptors
 });

 save();
 updatePeople();

 status.textContent=
  data.name+" の登録が完了しました。";

 document.getElementById("personName").value="";
}

// 全削除
document.getElementById("clear").onclick=()=>{
 if(!confirm("登録データをすべて削除しますか？"))return;

 registered=[];
 save();
 updatePeople();
};

// 初期化
async function init(){
 updatePeople();
 await loadModels();
 await startCamera();
}

init()

</script>
</body>
</html>
