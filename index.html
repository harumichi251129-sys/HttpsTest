
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human Recognition System</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#111;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:16px;
 border-bottom:1px solid #333;
}
main{
 max-width:1000px;
 margin:auto;
 padding:16px;
}
h2,h3{margin:0 0 12px}
#screen{
 position:relative;
 background:#000;
 border-radius:10px;
 overflow:hidden;
}
video{
 display:block;
 width:100%;
}
canvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
}
.panel{
 margin-top:15px;
 padding:16px;
 background:#202020;
 border-radius:10px;
}
input,button{
 padding:12px;
 border:0;
 border-radius:6px;
 font-size:14px;
}
input[type=text],input[type=number]{
 width:100%;
 background:#333;
 color:white;
 margin-top:8px;
}
input[type=checkbox]{
 width:auto;
}
button{
 background:#2878df;
 color:white;
 cursor:pointer;
 margin-top:8px;
}
button:disabled{
 opacity:.4;
 cursor:default;
}
button.danger{background:#a33}
#status{
 color:#aaa;
 font-size:13px;
 margin-top:12px;
}
#instruction{
 font-size:22px;
 font-weight:bold;
 text-align:center;
 margin:15px 0;
 color:#55aaff;
}
#progress{
 height:6px;
 background:#444;
 border-radius:10px;
 overflow:hidden;
 margin-top:10px;
}
#progressBar{
 height:100%;
 width:0%;
 background:#3989ff;
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
}
.data{
 background:#151515;
 padding:12px;
 border-radius:8px;
}
.data small{
 color:#999;
 display:block;
}
.data strong{
 display:block;
 margin-top:5px;
}
.person{
 padding:12px;
 border-bottom:1px solid #333;
}
.blue{color:#3989ff}
.red{color:#ff4545}
.green{color:#4cdb8b}
#tracks{
 display:grid;
 gap:8px;
}
.note{
 font-size:12px;
 color:#999;
 line-height:1.6;
}
</style>
</head>

<body>

<header>
<h2>Human Recognition System</h2>
</header>

<main>

<!-- CAMERA -->
<div id="screen">
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
</div>

<div class="panel">
<h3>システム状態</h3>
<div id="status">AIモデル読み込み中...</div>
</div>

<!-- CALIBRATION -->
<div class="panel">
<h3>① カメラ校正</h3>

<p class="note">
既知の距離に立った人物をカメラに映してください。
その人物の身長とカメラからの実際の距離を入力して校正します。
</p>

<label>校正する人物の身長（cm）</label>
<input id="calHeight" type="number" value="170">

<label>カメラからの実際の距離（m）</label>
<input id="calDistance" type="number" value="2" step="0.1">

<button id="calibrate" disabled>現在の映像でカメラを校正</button>

<div id="calStatus" class="note">
未校正
</div>
</div>

<!-- REGISTRATION -->
<div class="panel">
<h3>② 人物登録</h3>

<input id="personName" type="text" placeholder="登録する人の名前">

<label style="display:block;margin-top:10px">
<input id="consent" type="checkbox">
本人の同意を得て登録します
</label>

<div id="instruction">登録待機中</div>

<div id="progress">
<div id="progressBar"></div>
</div>

<button id="register" disabled>人物登録開始</button>

<p class="note">
正面・右・左の順番で撮影します。
各方向で顔の特徴を3回以上取得します。
登録中は対象者1人だけをカメラに映してください。
</p>
</div>

<!-- TRACKING -->
<div class="panel">
<h3>③ 検出中の人物</h3>
<div id="tracks"></div>
</div>

<!-- REGISTERED -->
<div class="panel">
<h3>④ 登録済み人物</h3>
<div id="people"></div>
<button id="clear" class="danger">登録データを全削除</button>
</div>

</main>

<!-- AI LIBRARIES -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<script>

// ====================================
// ELEMENTS
// ====================================

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const status=document.getElementById("status");
const tracksUI=document.getElementById("tracks");
const peopleUI=document.getElementById("people");

const instruction=document.getElementById("instruction");
const progressBar=document.getElementById("progressBar");

const registerButton=document.getElementById("register");
const calibrateButton=document.getElementById("calibrate");

// ====================================
// VARIABLES
// ====================================

let bodyModel=null;
let ready=false;
let processing=false;

let registered=JSON.parse(
 sessionStorage.getItem("registeredPeople")||"[]"
);

let tracks=[];
let nextTrackId=1;

let calibration=JSON.parse(
 localStorage.getItem("cameraCalibration")||"null"
);

let pendingCalibration=false;
let registering=null;
let registrationStep=0;

const steps=["front","right","left"];

const messages={
 front:"正面を向いてください",
 right:"右を向いてください",
 left:"左を向いてください"
};

const FACE_THRESHOLD=0.48;
const FACE_KEEP_TIME=1800;
const TRACK_KEEP_TIME=2500;

// ====================================
// STORAGE
// ====================================

function save(){
 sessionStorage.setItem(
  "registeredPeople",
  JSON.stringify(registered)
 );
}

function saveCalibration(){
 localStorage.setItem(
  "cameraCalibration",
  JSON.stringify(calibration)
 );
}

// ====================================
// UI
// ====================================

function updatePeople(){
 peopleUI.innerHTML="";

 if(!registered.length){
  peopleUI.textContent="登録なし";
  return;
 }

 registered.forEach((p,index)=>{
  const div=document.createElement("div");
  div.className="person";

  const name=document.createElement("strong");
  name.textContent=p.name;

  const count=document.createElement("small");
  count.textContent=
   "顔データ: "+
   Object.values(p.angles).reduce((n,a)=>n+a.length,0)+
   "件 / 全身データ: "+p.bodies.length+"件";

  const remove=document.createElement("button");
  remove.textContent="削除";
  remove.onclick=()=>{
   registered.splice(index,1);
   save();
   updatePeople();
  };

  div.append(name,count,remove);
  peopleUI.appendChild(div);
 });
}

function updateCalibrationUI(){
 document.getElementById("calStatus").textContent=
  calibration
   ?"校正済み / 焦点距離相当値: "+
    calibration.focal.toFixed(1)+" px"
   :"未校正";
}

// ====================================
// LOAD AI
// ====================================

async function loadModels(){
 try{
  status.textContent="顔認識モデル読み込み中...";

  const url=
   "https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights";

  await faceapi.nets.tinyFaceDetector.loadFromUri(url);
  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(url);
  await faceapi.nets.faceRecognitionNet.loadFromUri(url);

  status.textContent="人物検出モデル読み込み中...";

  bodyModel=await cocoSsd.load({
   base:"lite_mobilenet_v2"
  });

  status.textContent="AIモデル読み込み完了";

  registerButton.disabled=false;
  calibrateButton.disabled=false;

  startCamera();

 }catch(e){
  status.textContent="モデル読み込みエラー: "+e.message;
  console.error(e);
 }
}

// ====================================
// CAMERA
// ====================================

async function startCamera(){
 try{
  const stream=await navigator.mediaDevices.getUserMedia({
   video:{
    width:{ideal:640},
    height:{ideal:480},
    facingMode:"user"
   },
   audio:false
  });

  video.srcObject=stream;
  await video.play();

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  ready=true;
  detectLoop();

 }catch(e){
  status.textContent="カメラエラー: "+e.message;
 }
}

// ====================================
// CAMERA CALIBRATION
// ====================================

calibrateButton.onclick=()=>{
 const height=Number(
  document.getElementById("calHeight").value
 );

 const distance=Number(
  document.getElementById("calDistance").value
 );

 if(height<50||height>250||distance<=0){
  alert("身長と距離を正しく入力してください");
  return;
 }

 pendingCalibration={
  height:height/100,
  distance:distance
 };

 document.getElementById("calStatus").textContent=
  "校正待機中... 対象者1人を全身が映るようにしてください";
};

function calibratePerson(person){
 if(!pendingCalibration)return;

 const boxHeight=person.bbox[3];

 if(boxHeight<80)return;

 const focal=
  boxHeight*
  pendingCalibration.distance/
  pendingCalibration.height;

 calibration={
  focal:focal,
  referenceHeight:pendingCalibration.height,
  referenceDistance:pendingCalibration.distance,
  imageWidth:canvas.width,
  imageHeight:canvas.height
 };

 saveCalibration();
 updateCalibrationUI();

 pendingCalibration=false;

 document.getElementById("calStatus").textContent=
  "校正完了！ 距離推定が利用可能です。";
}

function estimateDistance(box){
 if(!calibration)return null;

 const height=box[3];

 if(height<=0)return null;

 // 校正時の人物と同じ身長を仮定した概算
 return calibration.focal*
  calibration.referenceHeight/height;
}

// ====================================
// BODY APPEARANCE FEATURE
// ====================================

const sampleCanvas=document.createElement("canvas");
sampleCanvas.width=40;
sampleCanvas.height=60;

const sampleCtx=sampleCanvas.getContext("2d",{
 willReadFrequently:true
});

function getBodyFeature(box){
 const [x,y,w,h]=box;

 const sx=Math.max(0,x);
 const sy=Math.max(0,y);
 const sw=Math.min(canvas.width-sx,w);
 const sh=Math.min(canvas.height-sy,h);

 if(sw<10||sh<20)return null;

 sampleCtx.drawImage(
  video,sx,sy,sw,sh,
  0,0,40,60
 );

 const data=sampleCtx.getImageData(
  0,0,40,60
 ).data;

 const hist=new Array(64).fill(0);

 for(let i=0;i<data.length;i+=16){
  const r=data[i]>>6;
  const g=data[i+1]>>6;
  const b=data[i+2]>>6;

  hist[r*16+g*4+b]++;
 }

 const total=hist.reduce((a,b)=>a+b,0);

 return hist.map(v=>v/total);
}

function featureDistance(a,b){
 if(!a||!b)return 1;

 let similarity=0;

 for(let i=0;i<a.length;i++){
  similarity+=Math.sqrt(a[i]*b[i]);
 }

 return 1-similarity;
}

// ====================================
// FACE ANGLE
// ====================================

function getAngle(face){
 const points=face.landmarks.positions;

 const nose=points[30];

 const leftEye=points.slice(36,42);
 const rightEye=points.slice(42,48);

 const leftX=leftEye.reduce((s,p)=>s+p.x,0)/6;
 const rightX=rightEye.reduce((s,p)=>s+p.x,0)/6;

 const center=(leftX+rightX)/2;
 const width=face.detection.box.width;

 const yaw=(nose.x-center)/width;

 if(yaw<-0.065)return "left";
 if(yaw>0.065)return "right";

 return "front";
}

// ====================================
// FACE MATCHING
// ====================================

function recognizeFace(descriptor){
 let best=null;
 let distance=Infinity;

 for(const person of registered){
  for(const angle of steps){
   for(const saved of person.angles[angle]){
    const d=faceapi.euclideanDistance(
     descriptor,
     saved
    );

    if(d<distance){
     distance=d;
     best=person;
    }
   }
  }
 }

 if(best&&distance<FACE_THRESHOLD){
  return best.name;
 }

 return null;
}

// ====================================
// REGISTRATION
// ====================================

registerButton.onclick=()=>{
 const name=document.getElementById("personName").value.trim();

 if(!name){
  alert("名前を入力してください");
  return;
 }

 if(!document.getElementById("consent").checked){
  alert("本人の同意を確認してください");
  return;
 }

 if(registering)return;

 registering={
  name,
  angles:{
   front:[],
   right:[],
   left:[]
  },
  bodies:[],
  lastCapture:0
 };

 registrationStep=0;

 instruction.textContent=messages.front;
 progressBar.style.width="0%";
};

function nextRegistrationStep(){
 registrationStep++;

 if(registrationStep>=3){
  finishRegistration();
  return;
 }

 instruction.textContent=
  messages[steps[registrationStep]];
}

function finishRegistration(){
 const data=registering;
 registering=null;

 if(!data)return;

 const counts={
  front:data.angles.front.length,
  right:data.angles.right.length,
  left:data.angles.left.length
 };

 if(
  counts.front<3||
  counts.right<3||
  counts.left<3||
  data.bodies.length<5
 ){
  instruction.textContent="登録失敗";
  status.textContent=
   "必要な特徴データが不足しています。再登録してください。";
  return;
 }

 registered=registered.filter(
  p=>p.name!==data.name
 );

 registered.push({
  name:data.name,
  angles:data.angles,
  bodies:data.bodies
 });

 save();
 updatePeople();

 instruction.textContent="登録完了！";
 progressBar.style.width="100%";

 document.getElementById("personName").value="";
}

// ====================================
// FACE AND BODY ASSOCIATION
// ====================================

function findFaceForPerson(person,faces){
 const [x,y,w,h]=person.bbox;

 let best=null;
 let area=0;

 for(const face of faces){
  const box=face.detection.box;

  const cx=box.x+box.width/2;
  const cy=box.y+box.height/2;

  if(
   cx>=x&&cx<=x+w&&
   cy>=y&&cy<=y+h
  ){
   const a=box.width*box.height;

   if(a>area){
    best=face;
    area=a;
   }
  }
 }

 return best;
}

// ====================================
// TRACKING
// ====================================

function IoU(a,b){
 const x1=Math.max(a[0],b[0]);
 const y1=Math.max(a[1],b[1]);
 const x2=Math.min(a[0]+a[2],b[0]+b[2]);
 const y2=Math.min(a[1]+a[3],b[1]+b[3]);

 const intersection=
  Math.max(0,x2-x1)*Math.max(0,y2-y1);

 const union=
  a[2]*a[3]+b[2]*b[3]-intersection;

 return union>0?intersection/union:0;
}

function centerOf(box){
 return {
  x:box[0]+box[2]/2,
  y:box[1]+box[3]/2
 };
}

function associateTracks(detections,now){
 const pairs=[];

 for(let i=0;i<detections.length;i++){
  for(let j=0;j<tracks.length;j++){
   const d=detections[i];
   const t=tracks[j];

   const oldCenter=centerOf(t.box);
   const newCenter=centerOf(d.bbox);

   const dx=newCenter.x-oldCenter.x;
   const dy=newCenter.y-oldCenter.y;

   const movement=Math.sqrt(dx*dx+dy*dy)/
    Math.max(30,Math.sqrt(t.box[2]**2+t.box[3]**2));

   const overlap=IoU(d.bbox,t.box);
   const appearance=featureDistance(
    d.feature,t.feature
   );

   if(
    movement<1.5&&
    (overlap>0.02||appearance<0.22)
   ){
    pairs.push({
     i,j,
     cost:
      0.55*(1-overlap)+
      0.45*appearance
    });
   }
  }
 }

 pairs.sort((a,b)=>a.cost-b.cost);

 const usedD=new Set();
 const usedT=new Set();

 for(const pair of pairs){
  if(usedD.has(pair.i)||usedT.has(pair.j))continue;

  const d=detections[pair.i];
  const t=tracks[pair.j];

  const oldCenter=centerOf(t.box);
  const newCenter=centerOf(d.bbox);

  const dt=Math.max(0.001,(now-t.lastSeen)/1000);

  t.vx=(newCenter.x-oldCenter.x)/dt;
  t.vy=(newCenter.y-oldCenter.y)/dt;

  t.box=d.bbox;
  t.feature=d.feature;
  t.lastSeen=now;
  t.matched=true;

  usedD.add(pair.i);
  usedT.add(pair.j);
 }

 for(let i=0;i<detections.length;i++){
  if(usedD.has(i))continue;

  const d=detections[i];

  tracks.push({
   id:nextTrackId++,
   box:d.bbox,
   feature:d.feature,
   name:null,
   lastFaceAt:0,
   lastSeen:now,
   vx:0,
   vy:0,
   matched:true
  });
 }

 tracks=tracks.filter(
  t=>now-t.lastSeen<TRACK_KEEP_TIME
 );
}

// ====================================
// MOVEMENT DIRECTION
// ====================================

function getDirection(track){
 const vx=track.vx;
 const vy=track.vy;

 const speed=Math.sqrt(vx*vx+vy*vy);

 if(speed<15)return "停止";

 if(Math.abs(vx)>Math.abs(vy)*1.4){
  return vx>0?"右":"左";
 }

 if(Math.abs(vy)>Math.abs(vx)*1.4){
  return vy>0?"下":"上";
 }

 if(vx>0&&vy>0)return "右下";
 if(vx>0&&vy<0)return "右上";
 if(vx<0&&vy>0)return "左下";

 return "左上";
}

// ====================================
// DRAW
// ====================================

function drawTrack(track,now){
 const [x,y,w,h]=track.box;

 const confirmed=
  track.name&&
  now-track.lastFaceAt<FACE_KEEP_TIME;

 ctx.strokeStyle=confirmed?"#ff3030":"#3989ff";
 ctx.lineWidth=3;

 ctx.strokeRect(x,y,w,h);

 let label=confirmed?track.name:"Unknown";

 if(track.name&&!confirmed){
  label="確認待ち";
 }

 ctx.font="bold 16px Arial";

 const tw=ctx.measureText(label).width;

 ctx.fillStyle=confirmed?"#ff3030":"#3989ff";

 ctx.fillRect(
  x,Math.max(0,y-25),tw+14,25
 );

 ctx.fillStyle="white";
 ctx.fillText(label,x+7,Math.max(18,y-7));
}

// ====================================
// TRACK INFORMATION
// ====================================

function updateTracksUI(now){
 tracksUI.innerHTML="";

 const visible=tracks.filter(
  t=>t.matched&&now-t.lastSeen<500
 );

 if(!visible.length){
  tracksUI.textContent="人物を検出していません";
  return;
 }

 for(const t of visible){
  const c=centerOf(t.box);

  const distance=estimateDistance(t.box);

  const speed=Math.sqrt(t.vx*t.vx+t.vy*t.vy);

  const confirmed=
   t.name&&
   now-t.lastFaceAt<FACE_KEEP_TIME;

  const div=document.createElement("div");
  div.className="data";

  const name=document.createElement("strong");
  name.className=confirmed?"red":"blue";
  name.textContent=
   "ID "+t.id+" : "+
   (confirmed?t.name:t.name?"確認待ち":"未登録");

  const info=document.createElement("div");
  info.className="note";
  info.style.marginTop="10px";

  info.textContent=
   "中心座標: X "+Math.round(c.x)+
   " / Y "+Math.round(c.y)+
   "\n枠サイズ: "+Math.round(t.box[2])+
   " × "+Math.round(t.box[3])+" px"+
   "\n移動方向: "+getDirection(t)+
   "\n移動速度: "+Math.round(speed)+" px/s"+
   "\n距離: "+
   (distance===null?"未校正":
    distance.toFixed(2)+" m（概算）");

  div.append(name,info);
  tracksUI.appendChild(div);
 }
}

// ====================================
// MAIN LOOP
// ====================================

async function detectLoop(){
 if(!ready||processing)return;

 processing=true;

 try{
  const now=Date.now();

  const [persons,faces]=await Promise.all([
   bodyModel.detect(video,20,0.45),

   faceapi.detectAllFaces(
    video,
    new faceapi.TinyFaceDetectorOptions({
     inputSize:320,
     scoreThreshold:0.5
    })
   )
   .withFaceLandmarks(true)
   .withFaceDescriptors()
  ]);

  const detections=[];

  for(const person of persons){
   if(person.class!=="person")continue;

   const feature=getBodyFeature(person.bbox);

   if(feature){
    detections.push({
     bbox:person.bbox,
     feature
    });
   }
  }

  // Calibration
  if(pendingCalibration){
   if(detections.length===1){
    calibratePerson(detections[0]);
   }
  }

  // Registration
  if(registering){
   if(detections.length===1){
    const face=findFaceForPerson(
     detections[0],faces
    );

    if(face&&now-registering.lastCapture>350){
     const angle=getAngle(face);
     const expected=steps[registrationStep];

     if(
      angle===expected&&
      face.detection.box.width>=70&&
      face.detection.score>=0.65
     ){
      registering.angles[angle].push(
       Array.from(face.descriptor)
      );

      registering.bodies.push(
       detections[0].feature
      );

      registering.lastCapture=now;

      const count=registering.angles[angle].length;

      progressBar.style.width=
       ((registrationStep*3+Math.min(count,3))/9*100)+"%";

      status.textContent=
       "登録中: "+messages[angle]+" ("+count+"/3)";

      if(count>=3){
       nextRegistrationStep();
      }
     }
    }
   }
  }

  // Track update
  associateTracks(detections,now);

  // Face identification
  for(let i=0;i<detections.length;i++){
   const face=findFaceForPerson(
    detections[i],faces
   );

   if(!face)continue;

   const matched=tracks.find(t=>
    t.matched&&
    IoU(t.box,detections[i].bbox)>0.5
   );

   if(!matched)continue;

   const name=recognizeFace(face.descriptor);

   if(name){
    matched.name=name;
    matched.lastFaceAt=now;
   }
  }

  // Draw
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(const t of tracks){
   if(t.matched&&now-t.lastSeen<500){
    drawTrack(t,now);
   }

   t.matched=false;
  }

  updateTracksUI(now);

  if(!registering&&!pendingCalibration){
   status.textContent=
    "検出中 / 人物数: "+detections.length+
    " / 追跡中: "+tracks.length;
  }

 }catch(e){
  console.error(e);
  status.textContent="処理エラー: "+e.message;
 }

 processing=false;

 setTimeout(detectLoop,350);
}

// DELETE

document.getElementById("clear").onclick=()=>{
 if(!confirm("登録データをすべて削除しますか？"))return;

 registered=[];
 tracks=[];

 sessionStorage.removeItem("registeredPeople");

 updatePeople();
};

// ====================================

updatePeople();
updateCalibrationUI();
loadModels();
